name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - p-work-from-current

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the process-heavy full test lane bounded. Coverage uses its own
  # c8-specific serial override below, independent from normal test concurrency.
  GEULBAT_TEST_JOBS: 2

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check Node
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Docs current-truth check
        run: npm run check:docs-current-truth

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      # 빌드 시점 assertion을 CI에서 살린다. `check`는 `tsc --noEmit`이라
      # Vite 빌드를 거치지 않으므로, artifact runtime chunk 경계와 hashed
      # asset 이름 전제는 실제 빌드가 돌아야 검증된다.
      - name: Build
        run: npm run build

      - name: Npm installable distribution
        run: npm run check:npm-installable-distribution -- --approved-client-id-file release/provider-auth-approved-client-ids.json

  test:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  real-app:
    name: Real-app flow gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium for the real-app flow gate
        run: npx --no-install playwright install --with-deps chromium

      - name: Real-app flow gate
        run: npm run gate:flows -w apps/web-shell

      - name: Upload real-app flow failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: real-app-flow-failure-evidence
          path: output/playwright/flow-gate/
          if-no-files-found: ignore

  daemon-coverage:
    name: Daemon coverage
    runs-on: ubuntu-latest
    env:
      # c8 instruments test children and their Node worker descendants. On
      # GitHub-hosted runners the four-way process fan-out can stall, while the
      # same coverage set completes reliably one-way. Normal tests stay parallel.
      GEULBAT_TEST_JOBS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Daemon coverage
        run: npm run test:cov:daemon

  verify:
    name: verify
    if: ${{ always() }}
    needs:
      - quality
      - test
      - real-app
      - daemon-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification shard
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          REAL_APP_RESULT: ${{ needs.real-app.result }}
          DAEMON_COVERAGE_RESULT: ${{ needs.daemon-coverage.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$REAL_APP_RESULT" = success
          test "$DAEMON_COVERAGE_RESULT" = success
